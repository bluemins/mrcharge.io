<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mr.Charge - Pure Distilled Water</title>
    <style>
        :root {
            --primary-color: #2c3e50; /* Slate/Industrial */
            --secondary-color: #34495e;
            --accent-color: #3498db;  /* Clean Blue */
            --text-color: #ffffff;
            --background: #f4f7f6;    /* Light clean grey */
            --dark-text: #2c3e50;
        }
        
        body { margin: 0; font-family: 'Montserrat', sans-serif; background-color: var(--background); color: var(--dark-text); }
        
        #game-area { width: 100%; height: 60vh; background: linear-gradient(to bottom, #bdc3c7, #2c3e50); position: relative; overflow: hidden; }
        
        #player { position: absolute; width: 60px; height: 60px; background: white; border-radius: 50%; bottom: 20px; transition: transform 0.1s; box-shadow: 0 0 15px rgba(255,255,255,0.5); }

        .hero { text-align: center; padding: 50px 20px; }
        .logo { font-size: 3.5rem; font-weight: 900; color: var(--primary-color); letter-spacing: 2px; }
        
        .signup-form { max-width: 500px; margin: 40px auto; padding: 30px; background: white; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        button { background-color: var(--accent-color); color: white; border: none; padding: 15px 30px; border-radius: 5px; cursor: pointer; width: 100%; font-size: 1rem; }
        button:hover { background-color: #2980b9; }

        @media (max-width: 768px) { .logo { font-size: 2.5rem; } }
    </style>
</head>
<body>

    <div id="game-area">
        <div id="player"></div>
    </div>

    <div class="hero">
        <div class="logo">MR.CHARGE</div>
        <p>Premium Distilled Water - Purity at < 10 TDS</p>
    </div>

    <div class="signup-form">
        <h3>Request a Bulk Quote</h3>
        <form id="notify-form">
            <input type="text" id="name" placeholder="Full Name" required>
            <input type="email" id="email" placeholder="Email Address" required>
            <input type="tel" id="phone" placeholder="Phone Number" required>
            <button type="submit">Submit Inquiry</button>
        </form>
    </div>

    <script>
        // Responsive handling without page reload
        let player = document.getElementById('player');
        let playerPosition = window.innerWidth / 2;

        function updatePlayerPos() {
            player.style.left = (playerPosition - 30) + 'px';
        }

        window.addEventListener('resize', () => {
            // Simply update variables, do not reload!
            updatePlayerPos();
        });

        document.getElementById('notify-form').addEventListener('submit', (e) => {
            e.preventDefault();
            alert('Thank you! Our sales team will contact you shortly regarding your Mr.Charge order.');
        });

        // Initialize
        updatePlayerPos();
    </script>
</body>
</html>
