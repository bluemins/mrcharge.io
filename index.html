<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mr.Charge | Distilled Water for Battery Life</title>
    <style>
        :root { --battery-yellow: #f1c40f; --industrial-grey: #2c3e50; --bg-dark: #1a1a1a; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background-color: var(--bg-dark); color: white; }
        
        /* Game Area */
        #game-area { width: 100%; height: 400px; background: #000; position: relative; overflow: hidden; border-bottom: 4px solid var(--battery-yellow); cursor: none; }
        #player { position: absolute; width: 80px; height: 60px; background: var(--industrial-grey); border: 2px solid var(--battery-yellow); border-radius: 5px; bottom: 10px; display: flex; align-items: center; justify-content: center; font-size: 30px; z-index: 10; }
        .drop { position: absolute; width: 20px; height: 30px; background: #3498db; border-radius: 0 0 10px 10px; }

        /* Branding & Gallery Section */
        .content-section { padding: 50px 20px; max-width: 1000px; margin: auto; text-align: center; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-top: 30px; }
        .placeholder-img { background: #333; height: 200px; display: flex; align-items: center; justify-content: center; border: 2px dashed #555; }
        
        .social-links { margin-top: 40px; }
        .social-links a { color: var(--battery-yellow); font-size: 1.5rem; margin: 0 15px; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <div id="game-area">
        <div id="player">🔋</div>
    </div>

    <div class="content-section">
        <h1 style="color: var(--battery-yellow);">MR.CHARGE</h1>
        <p>Premium Distilled Water for Lead-Acid & Solar Battery Systems</p>

        <!-- Gallery Section -->
        <div class="gallery">
            <div class="placeholder-img">Lead-Acid Battery Image</div>
            <div class="placeholder-img">Solar Battery Array Image</div>
            <div class="placeholder-img">Mr.Charge Product Bottle</div>
        </div>

        <!-- Social Links -->
        <div class="social-links">
            <a href="https://facebook.com/mrcharge0">Facebook</a>
            <a href="#">WhatsApp</a>
            <a href="#">Instagram</a>
        </div>
    </div>

    <script>
        const gameArea = document.getElementById('game-area');
        const player = document.getElementById('player');
        let playerX = window.innerWidth / 2;

        // Move player
        window.addEventListener('mousemove', (e) => {
            playerX = e.clientX - 40;
            if(playerX < 0) playerX = 0;
            if(playerX > window.innerWidth - 80) playerX = window.innerWidth - 80;
            player.style.left = playerX + 'px';
        });

        // Drop Logic
        function createDrop() {
            const drop = document.createElement('div');
            drop.className = 'drop';
            drop.style.left = Math.random() * (window.innerWidth - 20) + 'px';
            drop.style.top = '-30px';
            gameArea.appendChild(drop);

            let top = -30;
            let timer = setInterval(() => {
                top += 5;
                drop.style.top = top + 'px';

                // Simple Collision
                if (top > 330 && top < 360 && parseInt(drop.style.left) > playerX - 20 && parseInt(drop.style.left) < playerX + 80) {
                    drop.remove();
                    clearInterval(timer);
                }

                if (top > 400) { drop.remove(); clearInterval(timer); }
            }, 30);
        }

        setInterval(createDrop, 1200);
    </script>
</body>
</html>
