<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mr.Charge | Distilled Water for Battery Life</title>
    <style>
        :root {
            --battery-yellow: #f1c40f;
            --industrial-grey: #2c3e50;
            --accent-blue: #3498db;
            --bg-dark: #1a1a1a;
        }
        
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background-color: var(--bg-dark); color: white; }
        
        /* Game Area: Industrial Battery Theme */
        #game-area { width: 100%; height: 50vh; background: #000; position: relative; overflow: hidden; border-bottom: 5px solid var(--battery-yellow); }
        
        #player { 
            position: absolute; width: 70px; height: 50px; background: var(--industrial-grey); 
            border: 2px solid var(--battery-yellow); border-radius: 5px; bottom: 20px; 
            transition: transform 0.1s; display: flex; align-items: center; justify-content: center;
        }
        #player::after { content: '🔋'; font-size: 20px; }

        .battery-drop {
            position: absolute; width: 30px; height: 40px;
            background: var(--accent-blue); clip-path: polygon(20% 0%, 80% 0%, 100% 100%, 0% 100%);
        }

        .hero { text-align: center; padding: 40px 20px; }
        .logo { font-size: 3rem; font-weight: 900; color: var(--battery-yellow); text-transform: uppercase; }
        
        .signup-form { max-width: 450px; margin: 20px auto; padding: 25px; background: #222; border-left: 5px solid var(--battery-yellow); }
        input { width: 100%; padding: 12px; margin: 10px 0; background: #333; border: 1px solid #444; color: white; }
        button { background-color: var(--battery-yellow); color: black; font-weight: bold; border: none; padding: 15px; cursor: pointer; width: 100%; }
    </style>
</head>
<body>

    <div id="game-area">
        <div id="player"></div>
    </div>

    <div class="hero">
        <div class="logo">Mr.Charge</div>
        <p>Pure Distilled Water for Lead-Acid Battery Longevity</p>
    </div>

    <div class="signup-form">
        <h3>Maintain Your Power</h3>
        <form id="notify-form">
            <input type="text" placeholder="Name" required>
            <input type="email" placeholder="Email" required>
            <button type="submit">Order Distilled Water</button>
        </form>
    </div>

    <script>
        let player = document.getElementById('player');
        let playerPos = window.innerWidth / 2;
        
        // Update game objects to Battery Drop shapes
        function spawnBatteryDrop() {
            const drop = document.createElement('div');
            drop.className = 'battery-drop';
            drop.style.left = Math.random() * window.innerWidth + 'px';
            drop.style.top = '-50px';
            document.getElementById('game-area').appendChild(drop);
            
            let pos = -50;
            let fall = setInterval(() => {
                pos += 5;
                drop.style.top = pos + 'px';
                if (pos > window.innerHeight / 2) drop.remove();
            }, 50);
        }

        setInterval(spawnBatteryDrop, 2000);
        window.addEventListener('mousemove', (e) => {
            player.style.left = (e.clientX - 35) + 'px';
        });
    </script>
</body>
</html>
